version: "2"
linters:
  enable:
    - asciicheck
    - bodyclose
    - dogsled
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - whitespace
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    goconst:
      min-occurrences: 2
    gocyclo:
      min-complexity: 30
    misspell:
      locale: US
    nakedret:
      max-func-lines: 0
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
        path: _test\.go
      - path: (.+)\.go$
        text: Error return value of `.*\.EventErr(Kv)?` is not checked
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
